<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XB-Probe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏通栏吸顶（参考主题的 header 版式）：分组页签在左、站点名 +
       更新时间 + 图标按钮组在右。主题切换用太阳/月亮图标（CSS 按
       data-theme / 系统偏好切换显示哪个图标）；登录图标固定链接到 /admin/
       ——公开页读不到管理会话（HttpOnly Cookie、且演示部署常为跨端口），
       已登录时点它进入后台同样是合理去处，因此恒显示。 -->
  <header class="topbar">
    <div class="topbar-in">
      <div class="tabs" id="tabs" role="tablist" aria-label="按分组筛选节点"></div>
      <!-- DOM 顺序 = 视觉顺序：站名 → 更新时间 → 图标按钮组。
           站名在最左（它是这一组的标题），时间居中做辅助信息，图标贴最右。
           早期把 <h1> 写在按钮之后，靠 flex 也救不回来——屏幕上是
           "更新于… [月亮] XB-Probe"，站名落在最右，读起来像是按钮的附属。 -->
      <div class="topbar-right">
        <h1 class="site-title" id="site-title">XB-Probe</h1>
        <span class="muted" id="updated"></span>
        <span class="topbar-actions">
          <a class="icon-btn" id="btn-login" href="/admin/" title="管理后台" aria-label="管理后台">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </a>
          <button class="icon-btn tgl" id="btn-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
            <svg class="ico-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </span>
      </div>
    </div>
  </header>

  <div class="wrap">

    <!-- 汇总卡片。data-card 是 settings.public.cards 里的卡片键：
         后端在 /site 里下发允许展示的键集合，app.js 据此逐张 show/hide，
         并给 .kpis 挂 n<N> 类让列数跟着实际张数走（不留空格）。 -->
    <section class="kpis" id="kpis" aria-label="总体汇总">
      <div class="kpi" data-card="kpi_nodes">
        <div class="kpi-head"><span class="kpi-ico" aria-hidden="true">▦</span>节点</div>
        <div class="kpi-main">
          <b id="kpi-online">0</b><span class="kpi-sep">/</span><span class="kpi-total" id="kpi-total">0</span>
        </div>
        <div class="kpi-sub" id="kpi-offline">—</div>
      </div>

      <div class="kpi" data-card="kpi_busy">
        <div class="kpi-head"><span class="kpi-ico" aria-hidden="true">◔</span>最忙节点</div>
        <div class="kpi-main"><b id="kpi-busy-pct">—</b></div>
        <div class="kpi-sub" id="kpi-busy-name">—</div>
      </div>

      <div class="kpi" data-card="kpi_today">
        <div class="kpi-head"><span class="kpi-ico" aria-hidden="true">⇅</span>今日流量</div>
        <div class="kpi-pair">
          <div><span class="dir down" aria-label="下行">↓</span><b id="kpi-today-rx">—</b></div>
          <div><span class="dir up" aria-label="上行">↑</span><b id="kpi-today-tx">—</b></div>
        </div>
        <div class="kpi-sub">
          总流量 <span class="dir down" aria-label="累计下行">↓</span><span id="kpi-total-rx">—</span>
          <span class="dir up" aria-label="累计上行">↑</span><span id="kpi-total-tx">—</span>
        </div>
      </div>

      <div class="kpi" data-card="kpi_net">
        <div class="kpi-head"><span class="kpi-ico" aria-hidden="true">◷</span>实时网速</div>
        <div class="kpi-pair">
          <div><span class="dir down" aria-label="下行">↓</span><b id="kpi-rx">—</b></div>
          <div><span class="dir up" aria-label="上行">↑</span><b id="kpi-tx">—</b></div>
        </div>
        <canvas class="spark" id="spark" role="img" aria-label="聚合下行带宽趋势"></canvas>
      </div>

      <div class="kpi" data-card="kpi_fee">
        <div class="kpi-head"><span class="kpi-ico" aria-hidden="true">$</span>月费合计</div>
        <div class="kpi-main"><b id="kpi-fee">—</b></div>
        <div class="kpi-sub" id="kpi-fee-currency">—</div>
      </div>
    </section>

    <!-- 列表视图 -->
    <main id="list-view">
      <div class="grid nodes" id="nodes" aria-live="polite"></div>
      <p class="muted center" id="empty-tip" hidden>当前没有对公展示的节点。</p>
    </main>

    <!-- 详情视图 -->
    <main id="detail-view" hidden>
      <button class="ghost" id="btn-back" type="button">← 返回总览</button>
      <div class="detail-head">
        <span class="n-flag" id="detail-flag"></span>
        <h2 id="detail-name">节点</h2>
        <span class="chip" id="detail-status"></span>
        <span class="chip" id="detail-expire"></span>
      </div>

      <!-- 关键信息条：6 格 × 2 项。用固定结构代替原来 14 张等宽小卡，
           同样的信息量从 4 行压到 2 行，扫一眼就能拿到重点。 -->
      <div class="dinfo" id="detail-info"></div>

      <div class="section-head">
        <div class="tab-bar" id="detail-tabs">
          <button class="tab active" type="button" data-tab="resources">资源监控</button>
          <button class="tab" type="button" data-tab="latency">探测延迟</button>
        </div>
        <span class="spacer"></span>
        <label class="inline">时间范围
          <select id="range-select">
            <option value="30m">最近 30 分钟</option>
            <option value="1h">最近 1 小时</option>
            <option value="5h">最近 5 小时</option>
            <option value="24h" selected>最近 24 小时</option>
            <option value="7d">最近 7 天</option>
            <option value="30d">最近 30 天</option>
          </select>
        </label>
      </div>

      <div id="tab-resources" class="tab-panel">
        <div class="grid charts">
          <figure class="chart-card">
            <figcaption><span class="cap-t">CPU 使用率</span><span class="cap-m" id="cap-cpu">—</span></figcaption>
            <canvas class="chart" id="c-cpu" role="img" aria-label="CPU 使用率历史曲线"></canvas>
          </figure>
          <figure class="chart-card">
            <figcaption><span class="cap-t">内存已用</span><span class="cap-m" id="cap-mem">—</span></figcaption>
            <canvas class="chart" id="c-mem" role="img" aria-label="内存已用历史曲线"></canvas>
          </figure>
          <figure class="chart-card">
            <figcaption><span class="cap-t">网络速率</span><span class="cap-m" id="cap-net">—</span></figcaption>
            <canvas class="chart" id="c-net" role="img" aria-label="上下行带宽历史曲线"></canvas>
          </figure>
          <figure class="chart-card">
            <figcaption><span class="cap-t">磁盘已用</span><span class="cap-m" id="cap-disk">—</span></figcaption>
            <canvas class="chart" id="c-disk" role="img" aria-label="磁盘已用历史曲线"></canvas>
          </figure>
        </div>
      </div>

      <div id="tab-latency" class="tab-panel" hidden>
        <figure class="chart-card wide">
          <figcaption><span class="cap-t">各目标 RTT</span><span class="cap-m" id="cap-latency">—</span></figcaption>
          <canvas class="chart" id="c-latency" role="img" aria-label="各探测目标延迟曲线"></canvas>
          <div class="legend" id="latency-legend"></div>
        </figure>

        <div class="section-head"><h3>在线情况</h3><span class="muted" id="online-summary">—</span></div>
        <div class="online-strip" id="online-strip"></div>
        <p class="muted">每格 10 分钟。这段历史由"有没有上报"推导，与告警判定同源；
          鼠标悬停可看该时段的状态。</p>

        <div class="section-head"><h3>延迟明细</h3></div>
        <div class="grid cards-3" id="latency-list"></div>
      </div>
    </main>

    <footer class="muted foot-bar">
      <span id="foot-status"></span>
      <label class="foot-refresh">刷新间隔
        <select id="refresh-interval">
          <option value="1">1 秒</option>
          <option value="3" selected>3 秒</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
          <option value="30">30 秒</option>
        </select>
      </label>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
